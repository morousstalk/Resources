<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>Untitled</title>
    

  </head>
    
  <body>
  </title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: radial-gradient(circle at center, #2a1b42 0%, #0d0714 100%);
            font-family: sans-serif;
            touch-action: none; /* Evita trabas táctiles */
        }
        canvas { display: block; }

        /* --- ESTILOS DEL CARRETE (UI) --- */
        #carrete-contenedor {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 120px;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            padding: 0 20px;
            box-sizing: border-box;
            background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
            overflow-x: auto;
            overflow-y: hidden;
            gap: 15px;
            z-index: 10;
        }

        #carrete-contenedor::-webkit-scrollbar { display: none; }
        #carrete-contenedor { -ms-overflow-style: none; scrollbar-width: none; }

        .miniatura {
            height: 80px;
            width: auto;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 2px solid transparent;
        }

        .miniatura:hover { transform: scale(1.1); }
        .miniatura.activa {
            border: 2px solid #ffffff;
            box-shadow: 0 0 15px #aaccff;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div id="carrete-contenedor"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

        // --- BASE DE DATOS DE CARTAS ---
        const cartasDB = [
            {
                frente: 'https://raw.githubusercontent.com/morousstalk/Resources/main/Lilith%20Champion.png',
                dorso: 'https://raw.githubusercontent.com/morousstalk/Resources/main/en_7C0yERSDK6.png'
            },
            {
                frente: 'https://raw.githubusercontent.com/morousstalk/Resources/main/Tsikmon Rapacious.png', 
                dorso: 'https://raw.githubusercontent.com/morousstalk/Resources/main/en_7C0yERSDK6.png'
            },
            {
                frente: 'https://raw.githubusercontent.com/morousstalk/Resources/refs/heads/main/Human Templar Token.png',
                dorso: 'https://raw.githubusercontent.com/morousstalk/Resources/main/en_7C0yERSDK6.png'
            },
          {
            frente: 'https://raw.githubusercontent.com/morousstalk/Resources/main/Demonic Tutor.png', 
                dorso: 'https://raw.githubusercontent.com/morousstalk/Resources/main/en_7C0yERSDK6.png'
            },
            {
                frente: 'https://raw.githubusercontent.com/morousstalk/Resources/refs/heads/main/Lethal Thrust.png',
                dorso: 'https://raw.githubusercontent.com/morousstalk/Resources/main/en_7C0yERSDK6.png',
            }
        ];

        const ancho = 1.5;
        const alto = 2.1;
        const radioEsquina = 0.12;
        const separacionZ = 0.01; // La distancia entre el frente y el dorso

        // 1. Escena y Cámara
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 50);
        camera.position.set(0, 0, 4);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        // Límite de resolución para celulares (evita cuelgues)
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.6)); 
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 0.9; 
        document.body.appendChild(renderer.domElement);

        // 2. Iluminación
        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
        scene.add(ambientLight);

        const keyLight = new THREE.DirectionalLight(0xffffff, 1.2);
        keyLight.position.set(2, 3, 4);
        scene.add(keyLight);

        const fillLight = new THREE.DirectionalLight(0xaaccff, 0.8);
        fillLight.position.set(-2, -1, 2);
        scene.add(fillLight);

        // 3. Cargador de Texturas
        const textureLoader = new THREE.TextureLoader();
        const texturasCargadas = cartasDB.map(c => {
            const texF = textureLoader.load(c.frente);
            const texD = textureLoader.load(c.dorso);
            texF.colorSpace = THREE.SRGBColorSpace;
            texD.colorSpace = THREE.SRGBColorSpace;
            return { frente: texF, dorso: texD };
        });

        // 4. Materiales
        const materialCara = new THREE.MeshPhysicalMaterial({
            map: texturasCargadas[0].frente,
            iridescence: 0.8,              
            iridescenceIOR: 1.3,           
            iridescenceThicknessRange: [100, 400], 
            roughness: 0.3,                
            clearcoat: 1.0,                
            clearcoatRoughness: 0.1,      
            envMapIntensity: 0.5           
        });

        const materialDorso = new THREE.MeshStandardMaterial({
            map: texturasCargadas[0].dorso,
            roughness: 0.4,
            metalness: 0.1,
            side: THREE.FrontSide // Ya no necesita DoubleSide porque lo giramos
        });

        // 5. Geometría (ShapeGeometry para máximo rendimiento)
        function crearShapeCarta(ancho, alto, radio) {
            const shape = new THREE.Shape();
            const x = -ancho / 2;
            const y = -alto / 2;
            shape.moveTo(x, y + radio);
            shape.lineTo(x, y + alto - radio);
            shape.quadraticCurveTo(x, y + alto, x + radio, y + alto);
            shape.lineTo(x + ancho - radio, y + alto);
            shape.quadraticCurveTo(x + ancho, y + alto, x + ancho, y + alto - radio);
            shape.lineTo(x + ancho, y + radio);
            shape.quadraticCurveTo(x + ancho, y, x + ancho - radio, y);
            shape.lineTo(x + radio, y);
            shape.quadraticCurveTo(x, y, x, y + radio);
            return shape;
        }

        const shapeCarta = crearShapeCarta(ancho, alto, radioEsquina);
        
        // Geometría plana para el frente y el dorso
        const geometriaFrente = new THREE.ShapeGeometry(shapeCarta);
        geometriaFrente.center();
        
        const geometriaDorso = new THREE.ShapeGeometry(shapeCarta);
        geometriaDorso.center();

        // Arreglamos las UVs para ambas caras
        function arreglarUVs(geometria) {
            const pos = geometria.attributes.position;
            const uv = geometria.attributes.uv;
            for (let i = 0; i < pos.count; i++) {
                const u = (pos.getX(i) + ancho / 2) / ancho;
                const v = (pos.getY(i) + alto / 2) / alto;
                uv.setXY(i, u, v);
            }
        }
        arreglarUVs(geometriaFrente);
        arreglarUVs(geometriaDorso);

        // 6. Creamos los Meshes (Frente y Dorso)
        const mallaFrente = new THREE.Mesh(geometriaFrente, materialCara);
        mallaFrente.position.z = separacionZ / 2; // Un poquito adelante
        scene.add(mallaFrente);

        const mallaDorso = new THREE.Mesh(geometriaDorso, materialDorso);
        mallaDorso.position.z = -separacionZ / 2; // Un poquito atrás
        mallaDorso.rotation.y = Math.PI; // Lo giramos para que mire al otro lado
        scene.add(mallaDorso);

        // --- LÓGICA DEL CARRETE HTML ---
        const carreteContainer = document.getElementById('carrete-contenedor');

        function cambiarCarta(index) {
            materialCara.map = texturasCargadas[index].frente;
            materialDorso.map = texturasCargadas[index].dorso;
            
            materialCara.needsUpdate = true;
            materialDorso.needsUpdate = true;

            document.querySelectorAll('.miniatura').forEach((img, i) => {
                if (i === index) img.classList.add('activa');
                else img.classList.remove('activa');
            });

            // Efecto pop
            mallaFrente.scale.set(0.95, 0.95, 0.95);
            mallaDorso.scale.set(0.95, 0.95, 0.95);
            setTimeout(() => {
                mallaFrente.scale.set(1, 1, 1);
                mallaDorso.scale.set(1, 1, 1);
            }, 150);
        }

        cartasDB.forEach((carta, index) => {
            const img = document.createElement('img');
            img.src = carta.frente;
            img.classList.add('miniatura');
            if (index === 0) img.classList.add('activa');
            img.addEventListener('click', () => cambiarCarta(index));
            carreteContainer.appendChild(img);
        });

        // 7. Controles
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; 
        controls.dampingFactor = 0.05;
        controls.enablePan = false;    
        controls.minDistance = 2;      
        controls.maxDistance = 6;      
        
        // Evitar que el control de órbita gire la carta mostrando el canto (se vería como dos papeles)
        // Limitamos la rotación vertical para que no se vea desde arriba/abajo de forma extrema
        controls.minPolarAngle = Math.PI / 2 - 0.2; 
        controls.maxPolarAngle = Math.PI / 2 + 0.2;

        // 8. Animación
        function animate() {
            requestAnimationFrame(animate);
            controls.update(); 
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
    
  </body>
  
</html>

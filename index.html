<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>DeezCards</title>
    <link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  </title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: radial-gradient(circle at center, #2a1b42 0%, #0d0714 100%);
            font-family: sans-serif;
            touch-action: none; 
            overscroll-behavior: none;
        }
        canvas { display: block; }

        #carrete-contenedor {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 120px;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            padding: 0 20px;
            box-sizing: border-box;
            background: linear-gradient (to top, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
            overflow-x: auto;
            overflow-y: hidden;
            gap: 15px;
            z-index: 10;
        }

        # carrete-contenedor::-webkit-scrollbar { display: none; }
        # carrete-contenedor { -ms-overflow-style: none; scrollbar-width: none; }

        .miniatura {
            height: 80px;
            width: auto;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 2px solid transparent;
        }

        .miniatura:hover { transform: scale(1.1); }
        .miniatura.activa {
            border: 2px solid #ffffff;
            box-shadow: 0 0 15px #aaccff;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div id="carrete-contenedor"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

        const cartasDB = [
            {
                frente: 'https://raw.githubusercontent.com/morousstalk/Resources/main/Lilith%20Champion.png',
                dorso: 'https://raw.githubusercontent.com/morousstalk/Resources/main/en_7C0yERSDK6.png'
            },
            {
                 frente: 'https://raw.githubusercontent.com/morousstalk/Resources/main/Tsikmon Rapacious.png', 
                dorso: 'https://raw.githubusercontent.com/morousstalk/Resources/main/en_7C0yERSDK6.png'
            },
            {
                frente: 'https://raw.githubusercontent.com/morousstalk/Resources/refs/heads/main/ChakrAmans Scholar.png',
                dorso: 'https://raw.githubusercontent.com/morousstalk/Resources/main/en_7C0yERSDK6.png'
            },
          {
            frente: 'https://raw.githubusercontent.com/morousstalk/Resources/main/KGarfunke Guardian.png', 
                dorso: 'https://raw.githubusercontent.com/morousstalk/Resources/main/en_7C0yERSDK6.png'
            },
            {
                frente: 'https://raw.githubusercontent.com/morousstalk/Resources/refs/heads/main/Lethal Thrust.png',
                dorso: 'https://raw.githubusercontent.com/morousstalk/Resources/main/en_7C0yERSDK6.png',
              },
          {
              frente: 'https://raw.githubusercontent.com/morousstalk/Resources/main/Demonic Tutor.png', 
                dorso: 'https://raw.githubusercontent.com/morousstalk/Resources/main/en_7C0yERSDK6.png'
            },
            {
                frente: 'https://raw.githubusercontent.com/morousstalk/Resources/refs/heads/main/Kalaks Tyr City.png',
                dorso: 'https://raw.githubusercontent.com/morousstalk/Resources/main/en_7C0yERSDK6.png'
          },
          {
                frente: 'https://raw.githubusercontent.com/morousstalk/Resources/main/Contract Token.png',
                dorso: 'https://raw.githubusercontent.com/morousstalk/Resources/main/en_7C0yERSDK6.png'
            },
            {
                 frente: 'https://raw.githubusercontent.com/morousstalk/Resources/main/Zalamans Equilibrium.png', 
                dorso: 'https://raw.githubusercontent.com/morousstalk/Resources/main/en_7C0yERSDK6.png'
            },
            {
                frente: 'https://raw.githubusercontent.com/morousstalk/Resources/refs/heads/main/Dreamlike Showcase.png',
                dorso: 'https://raw.githubusercontent.com/morousstalk/Resources/main/en_7C0yERSDK6.png'
            },
          {
            frente: 'https://raw.githubusercontent.com/morousstalk/Resources/main/MrR The Collector.png', 
                dorso: 'https://raw.githubusercontent.com/morousstalk/Resources/main/Ravee Silverhand .png'
            },
            {
                frente: 'https://raw.githubusercontent.com/morousstalk/Resources/refs/heads/main/Silverspring Oasis.png',
                dorso: 'https://raw.githubusercontent.com/morousstalk/Resources/main/en_7C0yERSDK6.png'
              },
             {
              frente: 'https://raw.githubusercontent.com/morousstalk/Resources/main/Chaksa Up The Hill.png', 
                dorso: 'https://raw.githubusercontent.com/morousstalk/Resources/main/en_7C0yERSDK6.png',
               frente: 'https://raw.githubusercontent.com/morousstalk/Resources/refs/heads/main/Tik On The Prawl.png',
                dorso: 'https://raw.githubusercontent.com/morousstalk/Resources/main/en_7C0yERSDK6.png'
            },
          {
            frente: 'https://raw.githubusercontent.com/morousstalk/Resources/main/Watchful TikTik.png', 
                dorso: 'https://raw.githubusercontent.com/morousstalk/Resources/main/en_7C0yERSDK6.png'
            },
            {
                frente: 'https://raw.githubusercontent.com/morousstalk/Resources/refs/heads/main/Kiltektek Student.png',
                dorso: 'https://raw.githubusercontent.com/morousstalk/Resources/main/en_7C0yERSDK6.png'
              },
             {
              frente: 'https://raw.githubusercontent.com/morousstalk/Resources/main/Chaksa Up The Hill.png', 
                dorso: 'https://raw.githubusercontent.com/morousstalk/Resources/main/en_7C0yERSDK6.png',   
            }
        ];

        const ancho = 1.5;
        const alto = 2.1;
        const radioEsquina = 0.12;
        const separacionZ = 0.01; 

        // 1. Escena y Cámara
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 50);
        camera.position.set(0, 0, 4);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.6)); // Tu ajuste de rendimiento
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 0.9; 
        document.body.appendChild(renderer.domElement);

        // 2. Iluminación
        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const keyLight = new THREE.DirectionalLight(0xffffff, 1.2);
        keyLight.position.set(2, 3, 4);
        scene.add(keyLight);

        const fillLight = new THREE.DirectionalLight(0xaaccff, 0.8);
        fillLight.position.set(-2, -1, 2);
        scene.add(fillLight);

        // 3. Cargador de Texturas
        const textureLoader = new THREE.TextureLoader();
        const texturasCargadas = cartasDB.map(c => {
            const texF = textureLoader.load(c.frente);
            const texD = textureLoader.load(c.dorso);
            texF.colorSpace = THREE.SRGBColorSpace;
            texD.colorSpace = THREE.SRGBColorSpace;
            return { frente: texF, dorso: texD };
        });

        // 4. Materiales
        const materialCara = new THREE.MeshPhysicalMaterial({
            map: texturasCargadas[0].frente,
            iridescence: 0.8,              
            iridescenceIOR: 1.3,           
            iridescenceThicknessRange: [100, 400], 
            roughness: 0.3,                
            clearcoat: 1.0,                
            clearcoatRoughness: 0.1,      
            envMapIntensity: 0.5           
        });

        const materialDorso = new THREE.MeshStandardMaterial({
            map: texturasCargadas[0].dorso,
            roughness: 0.4,
            metalness: 0.1,
            side: THREE.FrontSide
        });

        // 5. Geometría
        function crearShapeCarta(ancho, alto, radio) {
            const shape = new THREE.Shape();
            const x = -ancho / 2;
            const y = -alto / 2;
            shape.moveTo(x, y + radio);
            shape.lineTo(x, y + alto - radio);
            shape.quadraticCurveTo(x, y + alto, x + radio, y + alto);
            shape.lineTo(x + ancho - radio, y + alto);
            shape.quadraticCurveTo(x + ancho, y + alto, x + ancho, y + alto - radio);
            shape.lineTo(x + ancho, y + radio);
            shape.quadraticCurveTo(x + ancho, y, x + ancho - radio, y);
            shape.lineTo(x + radio, y);
            shape.quadraticCurveTo(x, y, x, y + radio);
            return shape;
        }

        const shapeCarta = crearShapeCarta(ancho, alto, radioEsquina);
        const geometriaFrente = new THREE.ShapeGeometry(shapeCarta);
        geometriaFrente.center();
        const geometriaDorso = new THREE.ShapeGeometry(shapeCarta);
        geometriaDorso.center();

        function arreglarUVs(geometria) {
            const pos = geometria.attributes.position;
            const uv = geometria.attributes.uv;
            for (let i = 0; i < pos.count; i++) {
                const u = (pos.getX(i) + ancho / 2) / ancho;
                const v = (pos.getY(i) + alto / 2) / alto;
                uv.setXY(i, u, v);
            }
        }
        arreglarUVs(geometriaFrente);
        arreglarUVs(geometriaDorso);

        // 6. Creamos los Meshes y los agrupamos
        const mallaFrente = new THREE.Mesh(geometriaFrente, materialCara);
        mallaFrente.position.z = separacionZ / 2; 

        const mallaDorso = new THREE.Mesh(geometriaDorso, materialDorso);
        mallaDorso.position.z = -separacionZ / 2; 
        mallaDorso.rotation.y = Math.PI; 

        // El grupo nos permite rotar ambas caras juntas
        const cardGroup = new THREE.Group();
        cardGroup.add(mallaFrente);
        cardGroup.add(mallaDorso);
        scene.add(cardGroup);

        // --- LÓGICA DEL CARRETE HTML ---
        const carreteContainer = document.getElementById('carrete-contenedor');

        function cambiarCarta(index) {
            materialCara.map = texturasCargadas[index].frente;
            materialDorso.map = texturasCargadas[index].dorso;
            materialCara.needsUpdate = true;
            materialDorso.needsUpdate = true;

            document.querySelectorAll('.miniatura').forEach((img, i) => {
                if (i === index) img.classList.add('activa');
                else img.classList.remove('activa');
            });

            cardGroup.scale.set(0.95, 0.95, 0.95);
            setTimeout(() => { cardGroup.scale.set(1, 1, 1); }, 150);
        }

        cartasDB.forEach((carta, index) => {
            const img = document.createElement('img');
            img.src = carta.frente;
            img.classList.add('miniatura');
            if (index === 0) img.classList.add('activa');
            img.addEventListener('click', () => cambiarCarta(index));
            carreteContainer.appendChild(img);
        });

        // 7. Controles (Solo Zoom)
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; 
        controls.enablePan = false;    
        controls.enableRotate = false; // <--- APAGAMOS LA ROTACIÓN DE CÁMARA
        controls.minDistance = 2;      
        controls.maxDistance = 6;      
// --- 8. LÓGICA DE INERCIA (GIRAR CON EL DEDO) ---
let isDragging = false;
let previousPosition = { x: 0, y: 0 };
let velocity = { x: 0, y: 0 };
// ¡Ajustamos la física!
const friction = 0.985;      // Más cerca de 1 = se desliza mucho más tiempo
const sensitivity = 0.015;   // Un poquito más de respuesta al toque

renderer.domElement.addEventListener('pointerdown', (e) => {
    isDragging = true;
    previousPosition = { x: e.clientX, y: e.clientY };
    velocity = { x: 0, y: 0 }; 
});

window.addEventListener('pointermove', (e) => {
    if (!isDragging) return;
    
    const deltaX = e.clientX - previousPosition.x;
    const deltaY = e.clientY - previousPosition.y;
    
    // Solo actualizamos la velocidad si el dedo se movió
    if (Math.abs(deltaX) > 0 || Math.abs(deltaY) > 0) {
        velocity.y = deltaX * sensitivity;
        velocity.x = deltaY * sensitivity;
    }
    
    cardGroup.rotation.y += velocity.y;
    cardGroup.rotation.x += velocity.x;
    
    cardGroup.rotation.x = Math.max(-Math.PI / 4, Math.min(Math.PI / 4, cardGroup.rotation.x));
    
    previousPosition = { x: e.clientX, y: e.clientY };
});

// Al levantar el dedo, usamos pointerup y pointercancel (por si el sistema interrumpe)
window.addEventListener('pointerup', () => { isDragging = false; });
window.addEventListener('pointercancel', () => { isDragging = false; });

        // 9. Animación
        function animate() {
            requestAnimationFrame(animate);

            // Si no estamos tocando la pantalla, aplicamos la inercia
            if (!isDragging) {
                cardGroup.rotation.y += velocity.y;
                cardGroup.rotation.x += velocity.x;
                
                // Aplicamos fricción para que frene de a poco
                velocity.y *= friction;
                velocity.x *= friction;
                
                // Si la velocidad es muy baja, la detenemos para no gastar batería
                if (Math.abs(velocity.y) < 0.0001) velocity.y = 0;
                if (Math.abs(velocity.x) < 0.0001) velocity.x = 0;

                // Mantenemos el límite en el eje X
                cardGroup.rotation.x = Math.max(-Math.PI / 4, Math.min(Math.PI / 4, cardGroup.rotation.x));
            }

            controls.update(); 
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
